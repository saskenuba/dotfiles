# ef-kassio (light): Legible light grey theme with blue, red, magenta, and earthly colors.
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#fff7f7" # bg-main
foreground = "#201f36" # fg-main
dim_foreground = "#776f79" # fg-dim

[colors.cursor]
cursor = "#d06f30" # cursor
text = "#fff7f7" # bg-main

[colors.vi_mode_cursor]
cursor = "#d06f30" # cursor
text = "#fff7f7" # bg-main

[colors.selection]
background = "#dfe4f4" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#cbcfff" # bg-search-lazy
foreground = "#201f36" # fg-search-lazy

[colors.search.focused_match]
background = "#fac200" # bg-search-current
foreground = "#201f36" # fg-search-current

[colors.footer_bar]
background = "#e0bfba" # bg-mode-line-active
foreground = "#151515" # fg-mode-line-active

[colors.normal]
black = "#201f36" # fg-term-black
red = "#b00234" # fg-term-red
green = "#217a3c" # fg-term-green
yellow = "#9a6012" # fg-term-yellow
blue = "#3c3bbe" # fg-term-blue
magenta = "#a01f64" # fg-term-magenta
cyan = "#2f5f9f" # fg-term-cyan
white = "#c0bbbb" # fg-term-white

[colors.bright]
black = "#776f79" # fg-term-black-bright
red = "#e00033" # fg-term-red-bright
green = "#008358" # fg-term-green-bright
yellow = "#b6530f" # fg-term-yellow-bright
blue = "#4250ef" # fg-term-blue-bright
magenta = "#7022bf" # fg-term-magenta-bright
cyan = "#1077ab" # fg-term-cyan-bright
white = "#fff7f7" # fg-term-white-bright
