# ef-dream (dark): Legible dark purple grey theme with gold and nuanced colors.
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#232025" # bg-main
foreground = "#efd5c5" # fg-main
dim_foreground = "#8f8886" # fg-dim

[colors.cursor]
cursor = "#f3c09a" # cursor
text = "#232025" # bg-main

[colors.vi_mode_cursor]
cursor = "#f3c09a" # cursor
text = "#232025" # bg-main

[colors.selection]
background = "#544a50" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#4f509f" # bg-search-lazy
foreground = "#efd5c5" # fg-search-lazy

[colors.search.focused_match]
background = "#8f665f" # bg-search-current
foreground = "#efd5c5" # fg-search-current

[colors.footer_bar]
background = "#675072" # bg-mode-line-active
foreground = "#fedeff" # fg-mode-line-active

[colors.normal]
black = "#232025" # fg-term-black
red = "#ff6f6f" # fg-term-red
green = "#51b04f" # fg-term-green
yellow = "#c0b24f" # fg-term-yellow
blue = "#57b0ff" # fg-term-blue
magenta = "#ffaacf" # fg-term-magenta
cyan = "#6fb3c0" # fg-term-cyan
white = "#8f8886" # fg-term-white

[colors.bright]
black = "#5b595e" # fg-term-black-bright
red = "#ff7a5f" # fg-term-red-bright
green = "#3fc489" # fg-term-green-bright
yellow = "#d09950" # fg-term-yellow-bright
blue = "#80aadf" # fg-term-blue-bright
magenta = "#d0b0ff" # fg-term-magenta-bright
cyan = "#65c5a8" # fg-term-cyan-bright
white = "#efd5c5" # fg-term-white-bright
