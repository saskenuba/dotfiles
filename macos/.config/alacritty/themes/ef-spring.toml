# ef-spring (light): Legible light floral theme with cool, varied colors (green, cyan, red).
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#f6fff9" # bg-main
foreground = "#34494a" # fg-main
dim_foreground = "#777294" # fg-dim

[colors.cursor]
cursor = "#bf005f" # cursor
text = "#f6fff9" # bg-main

[colors.vi_mode_cursor]
cursor = "#bf005f" # cursor
text = "#f6fff9" # bg-main

[colors.selection]
background = "#d0e6ff" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#afdfff" # bg-search-lazy
foreground = "#34494a" # fg-search-lazy

[colors.search.focused_match]
background = "#efcf00" # bg-search-current
foreground = "#34494a" # fg-search-current

[colors.footer_bar]
background = "#90e8b0" # bg-mode-line-active
foreground = "#243228" # fg-mode-line-active

[colors.normal]
black = "#34494a" # fg-term-black
red = "#c42d2f" # fg-term-red
green = "#1a870f" # fg-term-green
yellow = "#a45f22" # fg-term-yellow
blue = "#375cc6" # fg-term-blue
magenta = "#d5206f" # fg-term-magenta
cyan = "#1f6fbf" # fg-term-cyan
white = "#c0c6c3" # fg-term-white

[colors.bright]
black = "#777294" # fg-term-black-bright
red = "#d03003" # fg-term-red-bright
green = "#007f68" # fg-term-green-bright
yellow = "#b6540f" # fg-term-yellow-bright
blue = "#5f5fdf" # fg-term-blue-bright
magenta = "#9435b4" # fg-term-magenta-bright
cyan = "#0f7b8f" # fg-term-cyan-bright
white = "#f6fff9" # fg-term-white-bright
