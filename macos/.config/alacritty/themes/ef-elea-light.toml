# ef-elea-light (light): Legible light green theme with brown, magenta, and green colors.
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#edf5e2" # bg-main
foreground = "#221321" # fg-main
dim_foreground = "#676470" # fg-dim

[colors.cursor]
cursor = "#770080" # cursor
text = "#edf5e2" # bg-main

[colors.vi_mode_cursor]
cursor = "#770080" # cursor
text = "#edf5e2" # bg-main

[colors.selection]
background = "#d9d2ef" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#cfceff" # bg-search-lazy
foreground = "#221321" # fg-search-lazy

[colors.search.focused_match]
background = "#efbf00" # bg-search-current
foreground = "#221321" # fg-search-current

[colors.footer_bar]
background = "#a5c67f" # bg-mode-line-active
foreground = "#142810" # fg-mode-line-active

[colors.normal]
black = "#221321" # fg-term-black
red = "#c3303a" # fg-term-red
green = "#00601f" # fg-term-green
yellow = "#9a501f" # fg-term-yellow
blue = "#375cc6" # fg-term-blue
magenta = "#80308f" # fg-term-magenta
cyan = "#1f70af" # fg-term-cyan
white = "#b0b7aa" # fg-term-white

[colors.bright]
black = "#676470" # fg-term-black-bright
red = "#d00000" # fg-term-red-bright
green = "#007047" # fg-term-green-bright
yellow = "#b04300" # fg-term-yellow-bright
blue = "#444fcf" # fg-term-blue-bright
magenta = "#5032aa" # fg-term-magenta-bright
cyan = "#00677f" # fg-term-cyan-bright
white = "#edf5e2" # fg-term-white-bright
