# ef-arbutus (light): Legible light pink theme with red and green colors.
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#ffead8" # bg-main
foreground = "#393330" # fg-main
dim_foreground = "#6e678f" # fg-dim

[colors.cursor]
cursor = "#208f10" # cursor
text = "#ffead8" # bg-main

[colors.vi_mode_cursor]
cursor = "#208f10" # cursor
text = "#ffead8" # bg-main

[colors.selection]
background = "#dbe0c0" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#afbeff" # bg-search-lazy
foreground = "#393330" # fg-search-lazy

[colors.search.focused_match]
background = "#efbf00" # bg-search-current
foreground = "#393330" # fg-search-current

[colors.footer_bar]
background = "#e9a0a0" # bg-mode-line-active
foreground = "#40231f" # fg-mode-line-active

[colors.normal]
black = "#393330" # fg-term-black
red = "#b0000f" # fg-term-red
green = "#007000" # fg-term-green
yellow = "#906200" # fg-term-yellow
blue = "#375cc6" # fg-term-blue
magenta = "#a23ea4" # fg-term-magenta
cyan = "#3f69af" # fg-term-cyan
white = "#c7b2ab" # fg-term-white

[colors.bright]
black = "#6e678f" # fg-term-black-bright
red = "#b20f00" # fg-term-red-bright
green = "#00704f" # fg-term-green-bright
yellow = "#b44405" # fg-term-yellow-bright
blue = "#5f55df" # fg-term-blue-bright
magenta = "#6448ca" # fg-term-magenta-bright
cyan = "#0f7688" # fg-term-cyan-bright
white = "#ffead8" # fg-term-white-bright
