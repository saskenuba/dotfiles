# ef-orange (light): Legible light theme with orange, yellow, and green colors.
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#ffedc9" # bg-main
foreground = "#6c4631" # fg-main
dim_foreground = "#6f6a70" # fg-dim

[colors.cursor]
cursor = "#cf5f00" # cursor
text = "#ffedc9" # bg-main

[colors.vi_mode_cursor]
cursor = "#cf5f00" # cursor
text = "#ffedc9" # bg-main

[colors.selection]
background = "#eeb48f" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#a6df70" # bg-search-lazy
foreground = "#6c4631" # fg-search-lazy

[colors.search.focused_match]
background = "#efcf00" # bg-search-current
foreground = "#6c4631" # fg-search-current

[colors.footer_bar]
background = "#ffc255" # bg-mode-line-active
foreground = "#742f18" # fg-mode-line-active

[colors.normal]
black = "#6c4631" # fg-term-black
red = "#ba2d2f" # fg-term-red
green = "#007a0a" # fg-term-green
yellow = "#a05a22" # fg-term-yellow
blue = "#375cc6" # fg-term-blue
magenta = "#ba3e54" # fg-term-magenta
cyan = "#467080" # fg-term-cyan
white = "#c9b088" # fg-term-white

[colors.bright]
black = "#6f6a70" # fg-term-black-bright
red = "#c13f00" # fg-term-red-bright
green = "#2f783f" # fg-term-green-bright
yellow = "#b05115" # fg-term-yellow-bright
blue = "#5f50df" # fg-term-blue-bright
magenta = "#8448aa" # fg-term-magenta-bright
cyan = "#0f738f" # fg-term-cyan-bright
white = "#ffedc9" # fg-term-white-bright
