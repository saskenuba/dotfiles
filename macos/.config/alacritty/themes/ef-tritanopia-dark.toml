# ef-tritanopia-dark (dark): Legible dark theme, optimized for blue-yellow color deficiency.
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#15050f" # bg-main
foreground = "#dfd0d5" # fg-main
dim_foreground = "#908890" # fg-dim

[colors.cursor]
cursor = "#fd3333" # cursor
text = "#15050f" # bg-main

[colors.vi_mode_cursor]
cursor = "#fd3333" # cursor
text = "#15050f" # bg-main

[colors.selection]
background = "#293140" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#007faa" # bg-search-lazy
foreground = "#dfd0d5" # fg-search-lazy

[colors.search.focused_match]
background = "#aa0010" # bg-search-current
foreground = "#dfd0d5" # fg-search-current

[colors.footer_bar]
background = "#671822" # bg-mode-line-active
foreground = "#ffffff" # fg-mode-line-active

[colors.normal]
black = "#15050f" # fg-term-black
red = "#cf4f5f" # fg-term-red
green = "#2fa526" # fg-term-green
yellow = "#c48702" # fg-term-yellow
blue = "#379cf6" # fg-term-blue
magenta = "#b0648f" # fg-term-magenta
cyan = "#3fafcf" # fg-term-cyan
white = "#908890" # fg-term-white

[colors.bright]
black = "#554f4f" # fg-term-black-bright
red = "#df4f4f" # fg-term-red-bright
green = "#00b066" # fg-term-green-bright
yellow = "#d0730f" # fg-term-yellow-bright
blue = "#6a88ff" # fg-term-blue-bright
magenta = "#a6699f" # fg-term-magenta-bright
cyan = "#4fafaf" # fg-term-cyan-bright
white = "#dfd0d5" # fg-term-white-bright
