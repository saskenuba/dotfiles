# ef-cyprus (light): Legible light ochre theme with green, yellow, teal, red colors.
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#fcf7ef" # bg-main
foreground = "#242521" # fg-main
dim_foreground = "#59786f" # fg-dim

[colors.cursor]
cursor = "#007f00" # cursor
text = "#fcf7ef" # bg-main

[colors.vi_mode_cursor]
cursor = "#007f00" # cursor
text = "#fcf7ef" # bg-main

[colors.selection]
background = "#e0e7e5" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#cfceff" # bg-search-lazy
foreground = "#242521" # fg-search-lazy

[colors.search.focused_match]
background = "#efbf00" # bg-search-current
foreground = "#242521" # fg-search-current

[colors.footer_bar]
background = "#c0df6f" # bg-mode-line-active
foreground = "#142010" # fg-mode-line-active

[colors.normal]
black = "#242521" # fg-term-black
red = "#9f0d0f" # fg-term-red
green = "#006f00" # fg-term-green
yellow = "#a7601f" # fg-term-yellow
blue = "#375cc6" # fg-term-blue
magenta = "#9a456f" # fg-term-magenta
cyan = "#1f70af" # fg-term-cyan
white = "#c5c3b8" # fg-term-white

[colors.bright]
black = "#59786f" # fg-term-black-bright
red = "#dd0020" # fg-term-red-bright
green = "#00824f" # fg-term-green-bright
yellow = "#bf4400" # fg-term-yellow-bright
blue = "#444fcf" # fg-term-blue-bright
magenta = "#8448aa" # fg-term-magenta-bright
cyan = "#007a9f" # fg-term-cyan-bright
white = "#fcf7ef" # fg-term-white-bright
