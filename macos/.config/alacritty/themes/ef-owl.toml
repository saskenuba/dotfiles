# ef-owl (dark): Legible dark grey theme with blue, cyan, magenta and desaturated colors.
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#292c2f" # bg-main
foreground = "#d0d0d0" # fg-main
dim_foreground = "#857f8f" # fg-dim

[colors.cursor]
cursor = "#afe6ef" # cursor
text = "#292c2f" # bg-main

[colors.vi_mode_cursor]
cursor = "#afe6ef" # cursor
text = "#292c2f" # bg-main

[colors.selection]
background = "#404f66" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#4f70aa" # bg-search-lazy
foreground = "#d0d0d0" # fg-search-lazy

[colors.search.focused_match]
background = "#8f665f" # bg-search-current
foreground = "#d0d0d0" # fg-search-current

[colors.footer_bar]
background = "#5b637e" # bg-mode-line-active
foreground = "#dadfe5" # fg-mode-line-active

[colors.normal]
black = "#292c2f" # fg-term-black
red = "#d67869" # fg-term-red
green = "#70bb70" # fg-term-green
yellow = "#c09f6f" # fg-term-yellow
blue = "#80a4e0" # fg-term-blue
magenta = "#e5a0ea" # fg-term-magenta
cyan = "#8fb8ea" # fg-term-cyan
white = "#857f8f" # fg-term-white

[colors.bright]
black = "#60676b" # fg-term-black-bright
red = "#df885f" # fg-term-red-bright
green = "#60bd90" # fg-term-green-bright
yellow = "#d1a45f" # fg-term-yellow-bright
blue = "#a0a0ef" # fg-term-blue-bright
magenta = "#cfa0e8" # fg-term-magenta-bright
cyan = "#7ac0b9" # fg-term-cyan-bright
white = "#d0d0d0" # fg-term-white-bright
