# ef-elea-dark (dark): Legible dark green theme with brown, magenta, and green colors.
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#222524" # bg-main
foreground = "#eaf2ef" # fg-main
dim_foreground = "#969faf" # fg-dim

[colors.cursor]
cursor = "#ef7fa8" # cursor
text = "#222524" # bg-main

[colors.vi_mode_cursor]
cursor = "#ef7fa8" # cursor
text = "#222524" # bg-main

[colors.selection]
background = "#543040" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#2f5f9f" # bg-search-lazy
foreground = "#eaf2ef" # fg-search-lazy

[colors.search.focused_match]
background = "#847020" # bg-search-current
foreground = "#eaf2ef" # fg-search-current

[colors.footer_bar]
background = "#35605d" # bg-mode-line-active
foreground = "#ecf0ff" # fg-mode-line-active

[colors.normal]
black = "#222524" # fg-term-black
red = "#ff656a" # fg-term-red
green = "#7fc87f" # fg-term-green
yellow = "#cac85f" # fg-term-yellow
blue = "#57aff6" # fg-term-blue
magenta = "#f59acf" # fg-term-magenta
cyan = "#6fcfd2" # fg-term-cyan
white = "#969faf" # fg-term-white

[colors.bright]
black = "#5e6160" # fg-term-black-bright
red = "#ff7a5f" # fg-term-red-bright
green = "#50cf89" # fg-term-green-bright
yellow = "#e0b02f" # fg-term-yellow-bright
blue = "#78afff" # fg-term-blue-bright
magenta = "#cfaaff" # fg-term-magenta-bright
cyan = "#60d5c2" # fg-term-cyan-bright
white = "#eaf2ef" # fg-term-white-bright
