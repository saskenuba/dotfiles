# ef-summer (light): Legible light warm pink theme with magenta, purple, gold, cyan colors.
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#fff2f3" # bg-main
foreground = "#4f4073" # fg-main
dim_foreground = "#786e74" # fg-dim

[colors.cursor]
cursor = "#cf0090" # cursor
text = "#fff2f3" # bg-main

[colors.vi_mode_cursor]
cursor = "#cf0090" # cursor
text = "#fff2f3" # bg-main

[colors.selection]
background = "#eecfff" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#cbcfff" # bg-search-lazy
foreground = "#4f4073" # fg-search-lazy

[colors.search.focused_match]
background = "#ffc200" # bg-search-current
foreground = "#4f4073" # fg-search-current

[colors.footer_bar]
background = "#ffa4dc" # bg-mode-line-active
foreground = "#341f58" # fg-mode-line-active

[colors.normal]
black = "#4f4073" # fg-term-black
red = "#d3303a" # fg-term-red
green = "#217a3c" # fg-term-green
yellow = "#a45f22" # fg-term-yellow
blue = "#375ce6" # fg-term-blue
magenta = "#ba35af" # fg-term-magenta
cyan = "#1f6fbf" # fg-term-cyan
white = "#cfb3c4" # fg-term-white

[colors.bright]
black = "#786e74" # fg-term-black-bright
red = "#e00033" # fg-term-red-bright
green = "#007f68" # fg-term-green-bright
yellow = "#b6532f" # fg-term-yellow-bright
blue = "#5250ef" # fg-term-blue-bright
magenta = "#8e44f3" # fg-term-magenta-bright
cyan = "#0f7b8f" # fg-term-cyan-bright
white = "#fff2f3" # fg-term-white-bright
