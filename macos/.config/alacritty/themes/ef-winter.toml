# ef-winter (dark): Legible dark purple-black theme with magenta, purple, fawn, teal colors.
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#0f0b15" # bg-main
foreground = "#b8c6d5" # fg-main
dim_foreground = "#807c9f" # fg-dim

[colors.cursor]
cursor = "#ff6ff0" # cursor
text = "#0f0b15" # bg-main

[colors.vi_mode_cursor]
cursor = "#ff6ff0" # cursor
text = "#0f0b15" # bg-main

[colors.selection]
background = "#342464" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#4648d0" # bg-search-lazy
foreground = "#b8c6d5" # fg-search-lazy

[colors.search.focused_match]
background = "#8f5040" # bg-search-current
foreground = "#b8c6d5" # fg-search-current

[colors.footer_bar]
background = "#5f1f5f" # bg-mode-line-active
foreground = "#dedeff" # fg-mode-line-active

[colors.normal]
black = "#0f0b15" # fg-term-black
red = "#f47359" # fg-term-red
green = "#29a444" # fg-term-green
yellow = "#b58a52" # fg-term-yellow
blue = "#3f95f6" # fg-term-blue
magenta = "#d369af" # fg-term-magenta
cyan = "#4fbaef" # fg-term-cyan
white = "#807c9f" # fg-term-white

[colors.bright]
black = "#4a4f62" # fg-term-black-bright
red = "#ef6560" # fg-term-red-bright
green = "#00a392" # fg-term-green-bright
