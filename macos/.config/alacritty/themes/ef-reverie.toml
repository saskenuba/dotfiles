# ef-reverie (light): Legible light cream theme with gold and nuanced colors.
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#f3eddf" # bg-main
foreground = "#4f204f" # fg-main
dim_foreground = "#6f6877" # fg-dim

[colors.cursor]
cursor = "#9d5744" # cursor
text = "#f3eddf" # bg-main

[colors.vi_mode_cursor]
cursor = "#9d5744" # cursor
text = "#f3eddf" # bg-main

[colors.selection]
background = "#e0d0ba" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#c0c0f0" # bg-search-lazy
foreground = "#4f204f" # fg-search-lazy

[colors.search.focused_match]
background = "#e2b270" # bg-search-current
foreground = "#4f204f" # fg-search-current

[colors.footer_bar]
background = "#d1b0df" # bg-mode-line-active
foreground = "#523044" # fg-mode-line-active

[colors.normal]
black = "#4f204f" # fg-term-black
red = "#ba2d2f" # fg-term-red
green = "#007a0a" # fg-term-green
yellow = "#87591f" # fg-term-yellow
blue = "#375cc6" # fg-term-blue
magenta = "#9f4e74" # fg-term-magenta
cyan = "#3060af" # fg-term-cyan
white = "#b9aaa8" # fg-term-white

[colors.bright]
black = "#6f6877" # fg-term-black-bright
red = "#b21f00" # fg-term-red-bright
green = "#008250" # fg-term-green-bright
yellow = "#a05900" # fg-term-yellow-bright
blue = "#5059c0" # fg-term-blue-bright
magenta = "#7755b4" # fg-term-magenta-bright
cyan = "#0b6e8a" # fg-term-cyan-bright
white = "#f3eddf" # fg-term-white-bright
