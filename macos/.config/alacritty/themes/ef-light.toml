# ef-light (light): Legible light theme with blue, magenta, cyan, purple colors.
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#ffffff" # bg-main
foreground = "#202020" # fg-main
dim_foreground = "#68759f" # fg-dim

[colors.cursor]
cursor = "#0033cc" # cursor
text = "#ffffff" # bg-main

[colors.vi_mode_cursor]
cursor = "#0033cc" # cursor
text = "#ffffff" # bg-main

[colors.selection]
background = "#bfefff" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#cbcfff" # bg-search-lazy
foreground = "#202020" # fg-search-lazy

[colors.search.focused_match]
background = "#fac200" # bg-search-current
foreground = "#202020" # fg-search-current

[colors.footer_bar]
background = "#b7c7ff" # bg-mode-line-active
foreground = "#151515" # fg-mode-line-active

[colors.normal]
black = "#202020" # fg-term-black
red = "#d3303a" # fg-term-red
green = "#217a3c" # fg-term-green
yellow = "#a45f22" # fg-term-yellow
blue = "#3740cf" # fg-term-blue
magenta = "#ba35af" # fg-term-magenta
cyan = "#1f6fbf" # fg-term-cyan
white = "#b3b3b3" # fg-term-white

[colors.bright]
black = "#68759f" # fg-term-black-bright
red = "#e00033" # fg-term-red-bright
green = "#008858" # fg-term-green-bright
yellow = "#b6532f" # fg-term-yellow-bright
blue = "#4250ef" # fg-term-blue-bright
magenta = "#6052cf" # fg-term-magenta-bright
cyan = "#1f77bb" # fg-term-cyan-bright
white = "#ffffff" # fg-term-white-bright
