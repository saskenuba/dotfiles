# ef-rosa (dark): Legible dark rosewood theme with magenta and green colors.
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#322023" # bg-main
foreground = "#e4d3e1" # fg-main
dim_foreground = "#9d9d9d" # fg-dim

[colors.cursor]
cursor = "#ef607a" # cursor
text = "#322023" # bg-main

[colors.vi_mode_cursor]
cursor = "#ef607a" # cursor
text = "#322023" # bg-main

[colors.selection]
background = "#45524a" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#2f5f9f" # bg-search-lazy
foreground = "#e4d3e1" # fg-search-lazy

[colors.search.focused_match]
background = "#847020" # bg-search-current
foreground = "#e4d3e1" # fg-search-current

[colors.footer_bar]
background = "#814558" # bg-mode-line-active
foreground = "#e8e5e7" # fg-mode-line-active

[colors.normal]
black = "#322023" # fg-term-black
red = "#ff707f" # fg-term-red
green = "#5fbb5f" # fg-term-green
yellow = "#e4c53f" # fg-term-yellow
blue = "#57aff6" # fg-term-blue
magenta = "#ffb2d6" # fg-term-magenta
cyan = "#5fc0dc" # fg-term-cyan
white = "#9d9d9d" # fg-term-white

[colors.bright]
black = "#6a5862" # fg-term-black-bright
red = "#ff7f5f" # fg-term-red-bright
green = "#49d081" # fg-term-green-bright
yellow = "#f2a85f" # fg-term-yellow-bright
blue = "#78b2ff" # fg-term-blue-bright
magenta = "#cfb1ff" # fg-term-magenta-bright
cyan = "#80dfbf" # fg-term-cyan-bright
white = "#e4d3e1" # fg-term-white-bright
