# ef-maris-dark (dark): Legible dark marine theme with blue, cyan, and green colors.
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#131c2b" # bg-main
foreground = "#eaedef" # fg-main
dim_foreground = "#969faf" # fg-dim

[colors.cursor]
cursor = "#8fdfff" # cursor
text = "#131c2b" # bg-main

[colors.vi_mode_cursor]
cursor = "#8fdfff" # cursor
text = "#131c2b" # bg-main

[colors.selection]
background = "#183c65" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#2f5f9f" # bg-search-lazy
foreground = "#eaedef" # fg-search-lazy

[colors.search.focused_match]
background = "#847020" # bg-search-current
foreground = "#eaedef" # fg-search-current

[colors.footer_bar]
background = "#2f527b" # bg-mode-line-active
foreground = "#ecf0ff" # fg-mode-line-active

[colors.normal]
black = "#131c2b" # fg-term-black
red = "#ff6f6f" # fg-term-red
green = "#41bf4f" # fg-term-green
yellow = "#d0d24f" # fg-term-yellow
blue = "#57b0ff" # fg-term-blue
magenta = "#f59acf" # fg-term-magenta
cyan = "#2fd0db" # fg-term-cyan
white = "#969faf" # fg-term-white

[colors.bright]
black = "#4a5664" # fg-term-black-bright
red = "#ff7a5f" # fg-term-red-bright
green = "#30c489" # fg-term-green-bright
yellow = "#f0c060" # fg-term-yellow-bright
blue = "#70a0ff" # fg-term-blue-bright
magenta = "#cf90ff" # fg-term-magenta-bright
cyan = "#65d5a8" # fg-term-cyan-bright
white = "#eaedef" # fg-term-white-bright
