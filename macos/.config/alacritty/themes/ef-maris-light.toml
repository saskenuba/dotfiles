# ef-maris-light (light): Legible light marine theme with blue, cyan, and green colors.
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#edf4f8" # bg-main
foreground = "#151a27" # fg-main
dim_foreground = "#676470" # fg-dim

[colors.cursor]
cursor = "#036f99" # cursor
text = "#edf4f8" # bg-main

[colors.vi_mode_cursor]
cursor = "#036f99" # cursor
text = "#edf4f8" # bg-main

[colors.selection]
background = "#c8dcff" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#cfceff" # bg-search-lazy
foreground = "#151a27" # fg-search-lazy

[colors.search.focused_match]
background = "#efbf00" # bg-search-current
foreground = "#151a27" # fg-search-current

[colors.footer_bar]
background = "#a0c2ef" # bg-mode-line-active
foreground = "#142810" # fg-mode-line-active

[colors.normal]
black = "#151a27" # fg-term-black
red = "#c3303a" # fg-term-red
green = "#007010" # fg-term-green
yellow = "#805a1f" # fg-term-yellow
blue = "#375cc6" # fg-term-blue
magenta = "#80308f" # fg-term-magenta
cyan = "#1f66af" # fg-term-cyan
white = "#afb8c3" # fg-term-white

[colors.bright]
black = "#676470" # fg-term-black-bright
red = "#d00000" # fg-term-red-bright
green = "#007047" # fg-term-green-bright
yellow = "#8b4400" # fg-term-yellow-bright
blue = "#444fcf" # fg-term-blue-bright
magenta = "#5f2fba" # fg-term-magenta-bright
cyan = "#006f70" # fg-term-cyan-bright
white = "#edf4f8" # fg-term-white-bright
