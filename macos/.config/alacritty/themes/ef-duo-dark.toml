# ef-duo-dark (dark): Legible dark theme with mostly blue and orange colors.
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#070019" # bg-main
foreground = "#d0d0d0" # fg-main
dim_foreground = "#857f8f" # fg-dim

[colors.cursor]
cursor = "#ef6f11" # cursor
text = "#070019" # bg-main

[colors.vi_mode_cursor]
cursor = "#ef6f11" # cursor
text = "#070019" # bg-main

[colors.selection]
background = "#042a50" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#4648d0" # bg-search-lazy
foreground = "#d0d0d0" # fg-search-lazy

[colors.search.focused_match]
background = "#8f5040" # bg-search-current
foreground = "#d0d0d0" # fg-search-current

[colors.footer_bar]
background = "#352487" # bg-mode-line-active
foreground = "#dedeff" # fg-mode-line-active

[colors.normal]
black = "#070019" # fg-term-black
red = "#ef656a" # fg-term-red
green = "#1fa526" # fg-term-green
yellow = "#c48702" # fg-term-yellow
blue = "#379cf6" # fg-term-blue
magenta = "#d369af" # fg-term-magenta
cyan = "#5faaef" # fg-term-cyan
white = "#857f8f" # fg-term-white

[colors.bright]
black = "#4a4759" # fg-term-black-bright
red = "#f47360" # fg-term-red-bright
green = "#00b982" # fg-term-green-bright
yellow = "#d0730f" # fg-term-yellow-bright
blue = "#6f80ff" # fg-term-blue-bright
magenta = "#af85ff" # fg-term-magenta-bright
cyan = "#0dafdf" # fg-term-cyan-bright
white = "#d0d0d0" # fg-term-white-bright
