# ef-duo-light (light): Legible light theme with mostly blue and yellow colors.
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#fff8f0" # bg-main
foreground = "#222222" # fg-main
dim_foreground = "#63728f" # fg-dim

[colors.cursor]
cursor = "#1144ff" # cursor
text = "#fff8f0" # bg-main

[colors.vi_mode_cursor]
cursor = "#1144ff" # cursor
text = "#fff8f0" # bg-main

[colors.selection]
background = "#caeafa" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#cbcfff" # bg-search-lazy
foreground = "#222222" # fg-search-lazy

[colors.search.focused_match]
background = "#fac200" # bg-search-current
foreground = "#222222" # fg-search-current

[colors.footer_bar]
background = "#f8cf8f" # bg-mode-line-active
foreground = "#111133" # fg-mode-line-active

[colors.normal]
black = "#222222" # fg-term-black
red = "#cc3333" # fg-term-red
green = "#217a3c" # fg-term-green
yellow = "#8a5d00" # fg-term-yellow
blue = "#375cd8" # fg-term-blue
magenta = "#ba35af" # fg-term-magenta
cyan = "#1f6fbf" # fg-term-cyan
white = "#c7c0ba" # fg-term-white

[colors.bright]
black = "#63728f" # fg-term-black-bright
red = "#dd1100" # fg-term-red-bright
green = "#008058" # fg-term-green-bright
yellow = "#9f4a00" # fg-term-yellow-bright
blue = "#4250ef" # fg-term-blue-bright
magenta = "#6052cf" # fg-term-magenta-bright
cyan = "#1f77bb" # fg-term-cyan-bright
white = "#fff8f0" # fg-term-white-bright
