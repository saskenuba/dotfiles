# ef-trio-dark (dark): Legible dark purple grey theme with magenta, blue, teal colors.
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#160f0f" # bg-main
foreground = "#d8cfd5" # fg-main
dim_foreground = "#908890" # fg-dim

[colors.cursor]
cursor = "#ff99ff" # cursor
text = "#160f0f" # bg-main

[colors.vi_mode_cursor]
cursor = "#ff99ff" # cursor
text = "#160f0f" # bg-main

[colors.selection]
background = "#16304f" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#4648d0" # bg-search-lazy
foreground = "#d8cfd5" # fg-search-lazy

[colors.search.focused_match]
background = "#8f5040" # bg-search-current
foreground = "#d8cfd5" # fg-search-current

[colors.footer_bar]
background = "#6a294f" # bg-mode-line-active
foreground = "#ffdfdf" # fg-mode-line-active

[colors.normal]
black = "#160f0f" # fg-term-black
red = "#f48359" # fg-term-red
green = "#60b444" # fg-term-green
yellow = "#d4a052" # fg-term-yellow
blue = "#7fa5f6" # fg-term-blue
magenta = "#d37faf" # fg-term-magenta
cyan = "#8fbaff" # fg-term-cyan
white = "#908890" # fg-term-white

[colors.bright]
black = "#564f55" # fg-term-black-bright
red = "#ff7560" # fg-term-red-bright
green = "#60bf88" # fg-term-green-bright
yellow = "#ef926f" # fg-term-yellow-bright
blue = "#8895ff" # fg-term-blue-bright
magenta = "#a698ef" # fg-term-magenta-bright
cyan = "#8fcfdf" # fg-term-cyan-bright
white = "#d8cfd5" # fg-term-white-bright
