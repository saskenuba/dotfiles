# ef-symbiosis (dark): Legible dark brown-black theme with blue, green, cyan, gold colors.
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#130911" # bg-main
foreground = "#d0d0d0" # fg-main
dim_foreground = "#857f8f" # fg-dim

[colors.cursor]
cursor = "#f0af7f" # cursor
text = "#130911" # bg-main

[colors.vi_mode_cursor]
cursor = "#f0af7f" # cursor
text = "#130911" # bg-main

[colors.selection]
background = "#3f2f40" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#4648d0" # bg-search-lazy
foreground = "#d0d0d0" # fg-search-lazy

[colors.search.focused_match]
background = "#8f5040" # bg-search-current
foreground = "#d0d0d0" # fg-search-current

[colors.footer_bar]
background = "#583435" # bg-mode-line-active
foreground = "#ffe5f0" # fg-mode-line-active

[colors.normal]
black = "#130911" # fg-term-black
red = "#ef6360" # fg-term-red
green = "#0faa26" # fg-term-green
yellow = "#bf9032" # fg-term-yellow
blue = "#3f95f6" # fg-term-blue
magenta = "#d369af" # fg-term-magenta
cyan = "#4fbaef" # fg-term-cyan
white = "#857f8f" # fg-term-white

[colors.bright]
black = "#4b3f47" # fg-term-black-bright
red = "#ff7355" # fg-term-red-bright
green = "#00a692" # fg-term-green-bright
yellow = "#d1843f" # fg-term-yellow-bright
blue = "#6a9fff" # fg-term-blue-bright
magenta = "#af85ff" # fg-term-magenta-bright
cyan = "#1dbfcf" # fg-term-cyan-bright
white = "#d0d0d0" # fg-term-white-bright
