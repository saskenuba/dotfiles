# modus-operandi (light): Elegant, highly legible theme with a white background.
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#ffffff" # bg-main
foreground = "#000000" # fg-main
dim_foreground = "#595959" # fg-dim

[colors.cursor]
cursor = "#000000" # cursor
text = "#ffffff" # bg-main

[colors.vi_mode_cursor]
cursor = "#000000" # cursor
text = "#ffffff" # bg-main

[colors.selection]
background = "#bdbdbd" # bg-region
text = "#000000" # fg-region

[colors.search.matches]
background = "#a4d5f9" # bg-search-lazy
foreground = "#000000" # fg-search-lazy

[colors.search.focused_match]
background = "#f3d000" # bg-search-current
foreground = "#000000" # fg-search-current

[colors.footer_bar]
background = "#c8c8c8" # bg-mode-line-active
foreground = "#000000" # fg-mode-line-active

[colors.normal]
black = "#000000" # fg-term-black
red = "#a60000" # fg-term-red
green = "#006800" # fg-term-green
yellow = "#6f5500" # fg-term-yellow
blue = "#0031a9" # fg-term-blue
magenta = "#721045" # fg-term-magenta
cyan = "#005e8b" # fg-term-cyan
white = "#a6a6a6" # fg-term-white

[colors.bright]
black = "#595959" # fg-term-black-bright
red = "#972500" # fg-term-red-bright
green = "#00663f" # fg-term-green-bright
yellow = "#884900" # fg-term-yellow-bright
blue = "#3548cf" # fg-term-blue-bright
magenta = "#531ab6" # fg-term-magenta-bright
cyan = "#005f5f" # fg-term-cyan-bright
white = "#ffffff" # fg-term-white-bright
