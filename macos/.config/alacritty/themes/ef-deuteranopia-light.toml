# ef-deuteranopia-light (light): Legible light theme, optimized for red-green color deficiency.
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#f5f5ff" # bg-main
foreground = "#1a1a2f" # fg-main
dim_foreground = "#70627f" # fg-dim

[colors.cursor]
cursor = "#0000bb" # cursor
text = "#f5f5ff" # bg-main

[colors.vi_mode_cursor]
cursor = "#0000bb" # cursor
text = "#f5f5ff" # bg-main

[colors.selection]
background = "#dadadf" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#cbcfff" # bg-search-lazy
foreground = "#1a1a2f" # fg-search-lazy

[colors.search.focused_match]
background = "#fac200" # bg-search-current
foreground = "#1a1a2f" # fg-search-current

[colors.footer_bar]
background = "#99c7ff" # bg-mode-line-active
foreground = "#0a0a1f" # fg-mode-line-active

[colors.normal]
black = "#1a1a2f" # fg-term-black
red = "#d3303a" # fg-term-red
green = "#217a3c" # fg-term-green
yellow = "#805d00" # fg-term-yellow
blue = "#375cd8" # fg-term-blue
magenta = "#ba35af" # fg-term-magenta
cyan = "#1f6fbf" # fg-term-cyan
white = "#b3b3c0" # fg-term-white

[colors.bright]
black = "#70627f" # fg-term-black-bright
red = "#e00033" # fg-term-red-bright
green = "#008058" # fg-term-green-bright
yellow = "#965000" # fg-term-yellow-bright
blue = "#4250ef" # fg-term-blue-bright
magenta = "#6052cf" # fg-term-magenta-bright
cyan = "#1477b2" # fg-term-cyan-bright
white = "#f5f5ff" # fg-term-white-bright
