# ef-tritanopia-light (light): Legible light theme, optimized for blue-yellow color deficiency.
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#fff9f9" # bg-main
foreground = "#1a1a1a" # fg-main
dim_foreground = "#756275" # fg-dim

[colors.cursor]
cursor = "#bb0000" # cursor
text = "#fff9f9" # bg-main

[colors.vi_mode_cursor]
cursor = "#bb0000" # cursor
text = "#fff9f9" # bg-main

[colors.selection]
background = "#dadadf" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#7bcfcf" # bg-search-lazy
foreground = "#1a1a1a" # fg-search-lazy

[colors.search.focused_match]
background = "#ffa2a0" # bg-search-current
foreground = "#1a1a1a" # fg-search-current

[colors.footer_bar]
background = "#ff99aa" # bg-mode-line-active
foreground = "#1a0a0f" # fg-mode-line-active

[colors.normal]
black = "#1a1a1a" # fg-term-black
red = "#aa0010" # fg-term-red
green = "#217a3c" # fg-term-green
yellow = "#805d00" # fg-term-yellow
blue = "#375cd8" # fg-term-blue
magenta = "#aa357f" # fg-term-magenta
cyan = "#2070af" # fg-term-cyan
white = "#bdb9b9" # fg-term-white

[colors.bright]
black = "#756275" # fg-term-black-bright
red = "#dd0000" # fg-term-red-bright
green = "#008058" # fg-term-green-bright
yellow = "#965000" # fg-term-yellow-bright
blue = "#4250ef" # fg-term-blue-bright
magenta = "#af40af" # fg-term-magenta-bright
cyan = "#007faa" # fg-term-cyan-bright
white = "#fff9f9" # fg-term-white-bright
