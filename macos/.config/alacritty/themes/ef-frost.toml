# ef-frost (light): Legible light cool theme with blue, cyan, teal, purple colors.
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#fcffff" # bg-main
foreground = "#232323" # fg-main
dim_foreground = "#66657f" # fg-dim

[colors.cursor]
cursor = "#0055bb" # cursor
text = "#fcffff" # bg-main

[colors.vi_mode_cursor]
cursor = "#0055bb" # cursor
text = "#fcffff" # bg-main

[colors.selection]
background = "#d4eaf3" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#cbcfff" # bg-search-lazy
foreground = "#232323" # fg-search-lazy

[colors.search.focused_match]
background = "#fac200" # bg-search-current
foreground = "#232323" # fg-search-current

[colors.footer_bar]
background = "#9ad0ff" # bg-mode-line-active
foreground = "#051524" # fg-mode-line-active

[colors.normal]
black = "#232323" # fg-term-black
red = "#c42d2f" # fg-term-red
green = "#008a00" # fg-term-green
yellow = "#aa6100" # fg-term-yellow
blue = "#004fc0" # fg-term-blue
magenta = "#aa44c5" # fg-term-magenta
cyan = "#1f6fbf" # fg-term-cyan
white = "#b5b8b8" # fg-term-white

[colors.bright]
black = "#66657f" # fg-term-black-bright
red = "#d03003" # fg-term-red-bright
green = "#00845f" # fg-term-green-bright
yellow = "#b6532f" # fg-term-yellow-bright
blue = "#4244ef" # fg-term-blue-bright
magenta = "#7f5ae0" # fg-term-magenta-bright
cyan = "#007a85" # fg-term-cyan-bright
white = "#fcffff" # fg-term-white-bright
