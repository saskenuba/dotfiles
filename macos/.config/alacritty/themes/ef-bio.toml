# ef-bio (dark): Legible dark green-black theme with green, teal, blue, purple colors.
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#111111" # bg-main
foreground = "#cfdfd5" # fg-main
dim_foreground = "#808f80" # fg-dim

[colors.cursor]
cursor = "#35f038" # cursor
text = "#111111" # bg-main

[colors.vi_mode_cursor]
cursor = "#35f038" # cursor
text = "#111111" # bg-main

[colors.selection]
background = "#3a3027" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#4648d0" # bg-search-lazy
foreground = "#cfdfd5" # fg-search-lazy

[colors.search.focused_match]
background = "#8f5040" # bg-search-current
foreground = "#cfdfd5" # fg-search-current

[colors.footer_bar]
background = "#00552f" # bg-mode-line-active
foreground = "#d0ffe0" # fg-mode-line-active

[colors.normal]
black = "#111111" # fg-term-black
red = "#ef6560" # fg-term-red
green = "#3fb83f" # fg-term-green
yellow = "#d4aa02" # fg-term-yellow
blue = "#37aff6" # fg-term-blue
magenta = "#d38faf" # fg-term-magenta
cyan = "#6fc5ef" # fg-term-cyan
white = "#808f80" # fg-term-white

[colors.bright]
black = "#505250" # fg-term-black-bright
red = "#f47360" # fg-term-red-bright
green = "#00c089" # fg-term-green-bright
yellow = "#e09a0f" # fg-term-yellow-bright
blue = "#78afff" # fg-term-blue-bright
magenta = "#af9fff" # fg-term-magenta-bright
cyan = "#5dc0aa" # fg-term-cyan-bright
white = "#cfdfd5" # fg-term-white-bright
