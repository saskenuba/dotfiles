# ef-trio-light (light): Legible light purple grey theme with magenta, blue, and teal colors.
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#f8f5ff" # bg-main
foreground = "#4f3363" # fg-main
dim_foreground = "#786e74" # fg-dim

[colors.cursor]
cursor = "#4f45ff" # cursor
text = "#f8f5ff" # bg-main

[colors.vi_mode_cursor]
cursor = "#4f45ff" # cursor
text = "#f8f5ff" # bg-main

[colors.selection]
background = "#eed0ff" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#cbcfff" # bg-search-lazy
foreground = "#4f3363" # fg-search-lazy

[colors.search.focused_match]
background = "#ffc200" # bg-search-current
foreground = "#4f3363" # fg-search-current

[colors.footer_bar]
background = "#ddb4ff" # bg-mode-line-active
foreground = "#241f48" # fg-mode-line-active

[colors.normal]
black = "#4f3363" # fg-term-black
red = "#c3303a" # fg-term-red
green = "#057800" # fg-term-green
yellow = "#a45f22" # fg-term-yellow
blue = "#375cd6" # fg-term-blue
magenta = "#ad45ba" # fg-term-magenta
cyan = "#1f6fbf" # fg-term-cyan
white = "#c3c0c9" # fg-term-white

[colors.bright]
black = "#786e74" # fg-term-black-bright
red = "#d03033" # fg-term-red-bright
green = "#007f6f" # fg-term-green-bright
yellow = "#b8532f" # fg-term-yellow-bright
blue = "#5165e4" # fg-term-blue-bright
magenta = "#705ae3" # fg-term-magenta-bright
cyan = "#0f7a9d" # fg-term-cyan-bright
white = "#f8f5ff" # fg-term-white-bright
