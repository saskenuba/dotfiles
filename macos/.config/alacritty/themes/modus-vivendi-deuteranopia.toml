# modus-vivendi-deuteranopia (dark): Deuteranopia-optimized theme with a black background.
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#000000" # bg-main
foreground = "#ffffff" # fg-main
dim_foreground = "#989898" # fg-dim

[colors.cursor]
cursor = "#efef00" # cursor
text = "#000000" # bg-main

[colors.vi_mode_cursor]
cursor = "#efef00" # cursor
text = "#000000" # bg-main

[colors.selection]
background = "#5a5a5a" # bg-region
text = "#ffffff" # fg-region

[colors.search.matches]
background = "#1640b0" # bg-search-lazy
foreground = "#ffffff" # fg-search-lazy

[colors.search.focused_match]
background = "#7a6100" # bg-search-current
foreground = "#ffffff" # fg-search-current

[colors.footer_bar]
background = "#2a2a6a" # bg-mode-line-active
foreground = "#ffffff" # fg-mode-line-active

[colors.normal]
black = "#000000" # fg-term-black
red = "#ff5f59" # fg-term-red
green = "#44bc44" # fg-term-green
yellow = "#cabf00" # fg-term-yellow
blue = "#2fafff" # fg-term-blue
magenta = "#feacd0" # fg-term-magenta
cyan = "#00d3d0" # fg-term-cyan
white = "#a6a6a6" # fg-term-white

[colors.bright]
black = "#595959" # fg-term-black-bright
red = "#ff6b55" # fg-term-red-bright
green = "#00c06f" # fg-term-green-bright
yellow = "#ffa00f" # fg-term-yellow-bright
blue = "#79a8ff" # fg-term-blue-bright
magenta = "#b6a0ff" # fg-term-magenta-bright
cyan = "#6ae4b9" # fg-term-cyan-bright
white = "#ffffff" # fg-term-white-bright
