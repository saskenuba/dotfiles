# ef-cherie (dark): Legible dark purple-black theme with warm colors (mostly pink, magenta, gold).
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#190a0f" # bg-main
foreground = "#d3cfcf" # fg-main
dim_foreground = "#808898" # fg-dim

[colors.cursor]
cursor = "#ff5aaf" # cursor
text = "#190a0f" # bg-main

[colors.vi_mode_cursor]
cursor = "#ff5aaf" # cursor
text = "#190a0f" # bg-main

[colors.selection]
background = "#232f3f" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#4648d0" # bg-search-lazy
foreground = "#d3cfcf" # fg-search-lazy

[colors.search.focused_match]
background = "#8f5040" # bg-search-current
foreground = "#d3cfcf" # fg-search-current

[colors.footer_bar]
background = "#771a4f" # bg-mode-line-active
foreground = "#ffcfdf" # fg-mode-line-active

[colors.normal]
black = "#190a0f" # fg-term-black
red = "#ff7359" # fg-term-red
green = "#60b444" # fg-term-green
yellow = "#e5b76f" # fg-term-yellow
blue = "#8fa5f6" # fg-term-blue
magenta = "#ef80bf" # fg-term-magenta
cyan = "#8fbaef" # fg-term-cyan
white = "#808898" # fg-term-white

[colors.bright]
black = "#594a4f" # fg-term-black-bright
red = "#ff656f" # fg-term-red-bright
green = "#60bf88" # fg-term-green-bright
yellow = "#ea9955" # fg-term-yellow-bright
blue = "#a897ef" # fg-term-blue-bright
magenta = "#df7fff" # fg-term-magenta-bright
cyan = "#8fcfdf" # fg-term-cyan-bright
white = "#d3cfcf" # fg-term-white-bright
