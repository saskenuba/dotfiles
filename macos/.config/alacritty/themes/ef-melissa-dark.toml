# ef-melissa-dark (dark): Legible dark honeybee theme with warm colors (yellow, red, green, cyan).
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#352718" # bg-main
foreground = "#e8e4b1" # fg-main
dim_foreground = "#90918a" # fg-dim

[colors.cursor]
cursor = "#f9cf7a" # cursor
text = "#352718" # bg-main

[colors.vi_mode_cursor]
cursor = "#f9cf7a" # cursor
text = "#352718" # bg-main

[colors.selection]
background = "#443a4f" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#4648d0" # bg-search-lazy
foreground = "#e8e4b1" # fg-search-lazy

[colors.search.focused_match]
background = "#8f5040" # bg-search-current
foreground = "#e8e4b1" # fg-search-current

[colors.footer_bar]
background = "#704f00" # bg-mode-line-active
foreground = "#f8efd8" # fg-mode-line-active

[colors.normal]
black = "#352718" # fg-term-black
red = "#ff7f7f" # fg-term-red
green = "#6fd560" # fg-term-green
yellow = "#e4b53f" # fg-term-yellow
blue = "#57aff6" # fg-term-blue
magenta = "#f0aac5" # fg-term-magenta
cyan = "#6fcad0" # fg-term-cyan
white = "#90918a" # fg-term-white

[colors.bright]
black = "#79665f" # fg-term-black-bright
red = "#ff7f4f" # fg-term-red-bright
green = "#65d590" # fg-term-green-bright
yellow = "#ffa21f" # fg-term-yellow-bright
blue = "#98bfff" # fg-term-blue-bright
magenta = "#c6a2fe" # fg-term-magenta-bright
cyan = "#70e0cf" # fg-term-cyan-bright
white = "#e8e4b1" # fg-term-white-bright
