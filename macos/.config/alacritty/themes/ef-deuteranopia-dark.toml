# ef-deuteranopia-dark (dark): Legible dark theme, optimized for red-green color deficiency.
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#000a1f" # bg-main
foreground = "#ddddee" # fg-main
dim_foreground = "#7f8797" # fg-dim

[colors.cursor]
cursor = "#ffff00" # cursor
text = "#000a1f" # bg-main

[colors.vi_mode_cursor]
cursor = "#ffff00" # cursor
text = "#000a1f" # bg-main

[colors.selection]
background = "#223848" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#266fd0" # bg-search-lazy
foreground = "#ddddee" # fg-search-lazy

[colors.search.focused_match]
background = "#5f5f00" # bg-search-current
foreground = "#ddddee" # fg-search-current

[colors.footer_bar]
background = "#003f8f" # bg-mode-line-active
foreground = "#ffffff" # fg-mode-line-active

[colors.normal]
black = "#000a1f" # fg-term-black
red = "#cf8560" # fg-term-red
green = "#3faa26" # fg-term-green
yellow = "#aa9f32" # fg-term-yellow
blue = "#3f90f0" # fg-term-blue
magenta = "#b379bf" # fg-term-magenta
cyan = "#5faaef" # fg-term-cyan
white = "#7f8797" # fg-term-white

[colors.bright]
black = "#445165" # fg-term-black-bright
red = "#e47360" # fg-term-red-bright
green = "#3fa672" # fg-term-green-bright
yellow = "#cfaf00" # fg-term-yellow-bright
blue = "#6a9fff" # fg-term-blue-bright
magenta = "#9f95ff" # fg-term-magenta-bright
cyan = "#0db0ff" # fg-term-cyan-bright
white = "#ddddee" # fg-term-white-bright
