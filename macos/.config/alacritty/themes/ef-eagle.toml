# ef-eagle (light): Legible light beige theme with brown, red, and desatured colors.
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#f1ecd0" # bg-main
foreground = "#231a1f" # fg-main
dim_foreground = "#685f53" # fg-dim

[colors.cursor]
cursor = "#774400" # cursor
text = "#f1ecd0" # bg-main

[colors.vi_mode_cursor]
cursor = "#774400" # cursor
text = "#f1ecd0" # bg-main

[colors.selection]
background = "#ddc5af" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#a0ddd0" # bg-search-lazy
foreground = "#231a1f" # fg-search-lazy

[colors.search.focused_match]
background = "#efbf00" # bg-search-current
foreground = "#231a1f" # fg-search-current

[colors.footer_bar]
background = "#cfab80" # bg-mode-line-active
foreground = "#2f1005" # fg-mode-line-active

[colors.normal]
black = "#231a1f" # fg-term-black
red = "#882000" # fg-term-red
green = "#226022" # fg-term-green
yellow = "#6b4500" # fg-term-yellow
blue = "#113384" # fg-term-blue
magenta = "#822478" # fg-term-magenta
cyan = "#125a7f" # fg-term-cyan
white = "#aea88e" # fg-term-white

[colors.bright]
black = "#685f53" # fg-term-black-bright
red = "#9a0000" # fg-term-red-bright
green = "#006e50" # fg-term-green-bright
yellow = "#843300" # fg-term-yellow-bright
blue = "#3a3da0" # fg-term-blue-bright
magenta = "#50119f" # fg-term-magenta-bright
cyan = "#00676f" # fg-term-cyan-bright
white = "#f1ecd0" # fg-term-white-bright
