# ef-night (dark): Legible dark sky blue theme with mostly green, blue, purple colors.
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#000e17" # bg-main
foreground = "#afbcbf" # fg-main
dim_foreground = "#70819f" # fg-dim

[colors.cursor]
cursor = "#00ccff" # cursor
text = "#000e17" # bg-main

[colors.vi_mode_cursor]
cursor = "#00ccff" # cursor
text = "#000e17" # bg-main

[colors.selection]
background = "#253146" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#2f5f9f" # bg-search-lazy
foreground = "#afbcbf" # fg-search-lazy

[colors.search.focused_match]
background = "#847020" # bg-search-current
foreground = "#afbcbf" # fg-search-current

[colors.footer_bar]
background = "#003a7f" # bg-mode-line-active
foreground = "#ceeeff" # fg-mode-line-active

[colors.normal]
black = "#000e17" # fg-term-black
red = "#ef656a" # fg-term-red
green = "#1fa526" # fg-term-green
yellow = "#c48502" # fg-term-yellow
blue = "#379cf6" # fg-term-blue
magenta = "#d570af" # fg-term-magenta
cyan = "#4fb0cf" # fg-term-cyan
white = "#70819f" # fg-term-white

[colors.bright]
black = "#444e59" # fg-term-black-bright
red = "#f47360" # fg-term-red-bright
green = "#00a972" # fg-term-green-bright
yellow = "#e6832f" # fg-term-yellow-bright
blue = "#6a88ff" # fg-term-blue-bright
magenta = "#af8aff" # fg-term-magenta-bright
cyan = "#3dc0b0" # fg-term-cyan-bright
white = "#afbcbf" # fg-term-white-bright
