# ef-autumn (dark): Legible dark brown-black theme with warm colors (red, yellow, green, teal).
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#0f0e06" # bg-main
foreground = "#cfbcba" # fg-main
dim_foreground = "#887c8a" # fg-dim

[colors.cursor]
cursor = "#ffaa33" # cursor
text = "#0f0e06" # bg-main

[colors.vi_mode_cursor]
cursor = "#ffaa33" # cursor
text = "#0f0e06" # bg-main

[colors.selection]
background = "#3f1324" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#4648d0" # bg-search-lazy
foreground = "#cfbcba" # fg-search-lazy

[colors.search.focused_match]
background = "#8f5040" # bg-search-current
foreground = "#cfbcba" # fg-search-current

[colors.footer_bar]
background = "#692a12" # bg-mode-line-active
foreground = "#feeeca" # fg-mode-line-active

[colors.normal]
black = "#0f0e06" # fg-term-black
red = "#ef656a" # fg-term-red
green = "#2fa526" # fg-term-green
yellow = "#c48702" # fg-term-yellow
blue = "#379cf6" # fg-term-blue
magenta = "#d570af" # fg-term-magenta
cyan = "#4fb0cf" # fg-term-cyan
white = "#887c8a" # fg-term-white

[colors.bright]
black = "#56524f" # fg-term-black-bright
red = "#f06a3f" # fg-term-red-bright
green = "#00b066" # fg-term-green-bright
yellow = "#d0730f" # fg-term-yellow-bright
blue = "#6a88ff" # fg-term-blue-bright
magenta = "#af8aff" # fg-term-magenta-bright
cyan = "#3dbbb0" # fg-term-cyan-bright
white = "#cfbcba" # fg-term-white-bright
