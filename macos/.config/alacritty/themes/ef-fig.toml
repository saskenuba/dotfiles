# ef-fig (dark): Legible dark theme with warm green, yellow, and magenta colors.
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#3b2043" # bg-main
foreground = "#e4d3e1" # fg-main
dim_foreground = "#9d9d9d" # fg-dim

[colors.cursor]
cursor = "#e0646a" # cursor
text = "#3b2043" # bg-main

[colors.vi_mode_cursor]
cursor = "#e0646a" # cursor
text = "#3b2043" # bg-main

[colors.selection]
background = "#643270" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#704fbf" # bg-search-lazy
foreground = "#e4d3e1" # fg-search-lazy

[colors.search.focused_match]
background = "#847020" # bg-search-current
foreground = "#e4d3e1" # fg-search-current

[colors.footer_bar]
background = "#57602e" # bg-mode-line-active
foreground = "#c8c597" # fg-mode-line-active

[colors.normal]
black = "#3b2043" # fg-term-black
red = "#ef797f" # fg-term-red
green = "#7fbb3f" # fg-term-green
yellow = "#e4c53f" # fg-term-yellow
blue = "#57aff6" # fg-term-blue
magenta = "#ffb2d6" # fg-term-magenta
cyan = "#5fc0dc" # fg-term-cyan
white = "#9d9d9d" # fg-term-white

[colors.bright]
black = "#6a586e" # fg-term-black-bright
red = "#ff7f5f" # fg-term-red-bright
green = "#79d081" # fg-term-green-bright
yellow = "#f2a85f" # fg-term-yellow-bright
blue = "#78b2ff" # fg-term-blue-bright
magenta = "#afb1ff" # fg-term-magenta-bright
cyan = "#80dfbf" # fg-term-cyan-bright
white = "#e4d3e1" # fg-term-white-bright
