# ef-melissa-light (light): Legible light honeybee theme with warm colors (yellow, red, green, cyan).
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#fff6d8" # bg-main
foreground = "#484431" # fg-main
dim_foreground = "#68708a" # fg-dim

[colors.cursor]
cursor = "#a07f00" # cursor
text = "#fff6d8" # bg-main

[colors.vi_mode_cursor]
cursor = "#a07f00" # cursor
text = "#fff6d8" # bg-main

[colors.selection]
background = "#f0d4d8" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#cfceff" # bg-search-lazy
foreground = "#484431" # fg-search-lazy

[colors.search.focused_match]
background = "#efbf00" # bg-search-current
foreground = "#484431" # fg-search-current

[colors.footer_bar]
background = "#f3cf72" # bg-mode-line-active
foreground = "#403328" # fg-mode-line-active

[colors.normal]
black = "#484431" # fg-term-black
red = "#ba2d2f" # fg-term-red
green = "#007a0a" # fg-term-green
yellow = "#a26310" # fg-term-yellow
blue = "#375cc6" # fg-term-blue
magenta = "#aa3e74" # fg-term-magenta
cyan = "#3f60af" # fg-term-cyan
white = "#c7b7a6" # fg-term-white

[colors.bright]
black = "#68708a" # fg-term-black-bright
red = "#c74400" # fg-term-red-bright
green = "#008250" # fg-term-green-bright
yellow = "#ba5205" # fg-term-yellow-bright
blue = "#5f5fdf" # fg-term-blue-bright
magenta = "#6448ca" # fg-term-magenta-bright
cyan = "#0f708a" # fg-term-cyan-bright
white = "#fff6d8" # fg-term-white-bright
