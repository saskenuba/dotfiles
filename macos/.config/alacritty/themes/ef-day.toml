# ef-day (light): Legible light sandy theme with warm, varied colors (yellow, red, green, purple).
# Generated by theme-generate.el from the Emacs palette; don't edit by hand.

[colors.primary]
background = "#fff5ea" # bg-main
foreground = "#584141" # fg-main
dim_foreground = "#63728f" # fg-dim

[colors.cursor]
cursor = "#cf1f00" # cursor
text = "#fff5ea" # bg-main

[colors.vi_mode_cursor]
cursor = "#cf1f00" # cursor
text = "#fff5ea" # bg-main

[colors.selection]
background = "#f0d2df" # bg-region
text = "CellForeground"

[colors.search.matches]
background = "#cfceff" # bg-search-lazy
foreground = "#584141" # fg-search-lazy

[colors.search.focused_match]
background = "#efbf00" # bg-search-current
foreground = "#584141" # fg-search-current

[colors.footer_bar]
background = "#ffaf72" # bg-mode-line-active
foreground = "#542f38" # fg-mode-line-active

[colors.normal]
black = "#584141" # fg-term-black
red = "#ba2d2f" # fg-term-red
green = "#007a0a" # fg-term-green
yellow = "#a45a22" # fg-term-yellow
blue = "#375cc6" # fg-term-blue
magenta = "#ca3e54" # fg-term-magenta
cyan = "#3f60af" # fg-term-cyan
white = "#c9c0b8" # fg-term-white

[colors.bright]
black = "#63728f" # fg-term-black-bright
red = "#ce3f00" # fg-term-red-bright
green = "#0f7f5f" # fg-term-green-bright
yellow = "#b75515" # fg-term-yellow-bright
blue = "#5f5fdf" # fg-term-blue-bright
magenta = "#8448aa" # fg-term-magenta-bright
cyan = "#0f7b8f" # fg-term-cyan-bright
white = "#fff5ea" # fg-term-white-bright
