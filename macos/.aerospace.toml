# See: https://nikitabobko.github.io/AeroSpace/guide#config-version
config-version = 2

# Start AeroSpace at login
start-at-login = true

# Reload on save. After enabling, reload once manually to start the auto-reloading
auto-reload-config = true

# Keep 1-9 alive even when empty (sketchybar always shows them).
# Version 1 inferred this from the bindings; version 2 needs it spelled out.
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
# after-startup-command = 'exec-and-forget sketchybar'
exec-on-workspace-change = [
    '/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED=$AEROSPACE_FOCUSED_WORKSPACE PREVIOUS=$AEROSPACE_PREV_WORKSPACE'
]

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
accordion-padding = 30
default-root-container-layout = 'tiles'  # tiles|accordion
default-root-container-orientation = 'auto'
key-mapping.preset = 'qwerty'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See: https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
inner.horizontal = 7
inner.vertical =   7

# Per-monitor: 30 for external (e.g. Gigabyte M34), 0 for built-in MacBook display
outer.top = [{ monitor."built-in" = 0 }, 30]
outer.left = 2
outer.right = 2

# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.main.binding]

# All possible commands: https://nikitabobko.github.io/AeroSpace/commands

# See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
# Open a terminal in the folder the focused window is in (Alacritty cwd / Finder folder).
ctrl-shift-enter = 'exec-and-forget /Users/martinmariano/Documents/dotfiles/.myscripts/term-here.sh'

# See: https://nikitabobko.github.io/AeroSpace/commands#focus
# Cycle next/prev window in tree order (left-to-right, top-to-bottom), any layout
cmd-k = 'focus --wrap-around dfs-next'
cmd-h = 'focus --wrap-around dfs-prev'
cmd-enter = 'swap --wrap-around left'

# See: https://nikitabobko.github.io/AeroSpace/commands#move
ctrl-alt-shift-cmd-h = 'move left'
ctrl-alt-shift-cmd-j = 'move down'
ctrl-alt-shift-cmd-k = 'move up'
ctrl-alt-shift-cmd-l = 'move right'

# See: https://nikitabobko.github.io/AeroSpace/commands#resize
ctrl-alt-shift-cmd-minus = 'resize smart -50'
ctrl-alt-shift-cmd-equal = 'resize smart +50'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace
cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-6 = 'workspace 6'
cmd-7 = 'workspace 7'
cmd-8 = 'workspace 8'
cmd-9 = 'workspace 9'

# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
cmd-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
cmd-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
cmd-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
cmd-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
cmd-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
cmd-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
cmd-shift-7 = 'move-node-to-workspace --focus-follows-window 7'
cmd-shift-8 = 'move-node-to-workspace --focus-follows-window 8'
cmd-shift-9 = 'move-node-to-workspace --focus-follows-window 9'
cmd-shift-a = 'move-node-to-workspace --focus-follows-window prev'
cmd-shift-d = 'move-node-to-workspace --focus-follows-window next'

# Kill current window
cmd-shift-c = 'close --quit-if-last-window'
cmd-t = 'layout tiles'
cmd-f = 'fullscreen'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
ctrl-alt-shift-tab = 'workspace-back-and-forth'
# See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
shift-cmd-period = 'move-node-to-monitor --focus-follows-window --wrap-around next'
cmd-period = 'focus-monitor --wrap-around next'

# See: https://nikitabobko.github.io/AeroSpace/commands#mode
ctrl-alt-shift-cmd-semicolon = 'mode service'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
#s = ['layout sticky tiling', 'mode main'] # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']


ctrl-alt-shift-cmd-h = ['join-with left', 'mode main']
ctrl-alt-shift-cmd-j = ['join-with down', 'mode main']
ctrl-alt-shift-cmd-k = ['join-with up', 'mode main']
ctrl-alt-shift-cmd-l = ['join-with right', 'mode main']

